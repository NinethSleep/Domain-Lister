<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Lister</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');
  :root{
    --ink:#121014; --panel:#1c1a20; --panel-2:#232028;
    --paper:#EDEAE4; --paper-dim:#9a958f; --red:#FF4B3E;
    --lavender:#8B85C1; --border:#332f38;
    --radius:10px;
    --bevel: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
  header{padding:28px 20px 14px;border-bottom:2px solid var(--border);}
  h1{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;margin:0 0 4px;}
  h1 span{color:var(--red);}
  .sub{color:var(--paper-dim);font-size:13px;margin:0;}
  .search-wrap{padding:18px 20px 8px;}
  .row{display:flex;gap:8px;}
  input[type=text]{
    flex:1;padding:14px 16px;background:var(--panel);border:2px solid var(--border);
    color:var(--paper);font-size:16px;font-family:'Inter',sans-serif;border-radius:var(--radius);outline:none;
    box-shadow:var(--bevel);
  }
  input[type=text]:focus{border-color:var(--red);}
  button{
    padding:14px 18px;background:var(--red);color:var(--ink);border:none;
    font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:0.5px;
    border-radius:var(--radius);cursor:pointer;box-shadow:var(--bevel);
  }
  button:active{opacity:0.85;}
  button:disabled{background:var(--border);color:var(--paper-dim);}
  .settings{padding:0 20px 6px;}
  .settings-panel{border-bottom:2px solid var(--border);}
  .settings-panel-summary{
    padding:14px 20px;font-size:14px;font-weight:500;color:var(--paper);
    cursor:pointer;list-style:none;
  }
  .settings-panel-summary::-webkit-details-marker{display:none;}
  .anilist-btn{
    margin-top:8px;width:100%;padding:10px;background:var(--panel-2);color:var(--lavender);
    border:1px solid var(--border);border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:13px;
    box-shadow:var(--bevel);
  }
  .clear-cache-row{padding:0 20px 14px;text-align:right;}
  .clear-cache-btn{
    background:none;border:none;color:var(--paper-dim);font-size:11.5px;
    text-decoration:underline;padding:0;font-family:'Inter',sans-serif;
  }
  .settings summary{color:var(--paper-dim);font-size:12.5px;cursor:pointer;}
  .settings input, .settings textarea{
    width:100%;margin-top:8px;padding:10px 12px;background:var(--panel);
    border:1px solid var(--border);color:var(--paper);font-size:14px;border-radius:var(--radius);
    font-family:'Inter',sans-serif;resize:vertical;box-shadow:var(--bevel);
  }
  .settings input:disabled{
    opacity:0.45;cursor:not-allowed;
  }
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 20px;
  }
  .toggle-row span{font-size:13.5px;color:var(--paper);font-weight:500;}
  .switch{
    position:relative;width:46px;height:26px;flex-shrink:0;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;cursor:pointer;inset:0;
    background:var(--border);transition:0.2s;border-radius:26px;
  }
  .slider::before{
    content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;
    background:var(--paper);transition:0.2s;border-radius:50%;
  }
  .switch input:checked + .slider{background:var(--red);}
  .switch input:checked + .slider::before{transform:translateX(20px);}
  main{padding:8px 20px 60px;}
  .status{color:var(--paper-dim);font-size:13px;padding:20px 0;text-align:center;}
  .status.error{color:var(--red);}
  .summary{
    color:var(--lavender);font-size:13px;padding:14px 0 6px;
    border-bottom:1px solid var(--border);margin-bottom:10px;
  }
  .result{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;box-shadow:var(--bevel);
  }
  .result .domain{color:var(--paper);font-weight:600;font-size:14px;}
  .result a{color:var(--lavender);font-size:12px;word-break:break-all;text-decoration:none;}
  .chapter-row{
    display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;
  }
  .chapter-check-btn{
    background:var(--panel-2);color:var(--paper-dim);border:1px solid var(--border);
    padding:6px 10px;border-radius:8px;font-family:'Inter',sans-serif;font-size:11.5px;
    cursor:pointer;box-shadow:var(--bevel);
  }
  .chapter-check-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .chapter-result{font-size:11.5px;}
  .recheck-btn{
    background:none;border:none;color:var(--lavender);font-size:11px;
    text-decoration:underline;cursor:pointer;padding:0;margin-left:4px;font-family:'Inter',sans-serif;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .chip{
    background:var(--panel-2);border:1px solid var(--border);color:var(--lavender);
    font-size:12.5px;padding:6px 10px;border-radius:20px;
  }
  .chip-domain{color:var(--paper-dim);font-size:11px;}
</style>
</head>
<body>

<header>
  <h1>Domain<span>Lister</span></h1>
  <p class="sub">search one query, list every URL and domain in the results</p>
</header>

<details class="settings-panel">
  <summary class="settings-panel-summary">⚙ Settings</summary>

  <div class="settings">
    <details>
      <summary>Tavily API key (saved on this device only)</summary>
      <input type="text" id="apiKey" placeholder="Paste your Tavily API key">
    </details>
    <details style="margin-top:6px;">
      <summary>Custom domain filter (optional — blank means search everywhere)</summary>
      <input type="text" id="includeDomains" placeholder="e.g. comix.to, mangapark.io">
    </details>
  </div>

  <div class="toggle-row">
    <span>Auto-detect aliases via AniList</span>
    <label class="switch">
      <input type="checkbox" id="aniListAutoToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Search Manhwa Sources</span>
    <label class="switch">
      <input type="checkbox" id="manhwaToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="clear-cache-row">
    <button id="clearCacheBtn" type="button" class="clear-cache-btn">Clear cached results</button>
  </div>
</details>

<div class="search-wrap">
  <div class="row">
    <input type="text" id="q" placeholder="Search query..." autocomplete="off">
    <button id="go">Search</button>
  </div>
</div>

<main id="results">
  <p class="status">Enter your API key above, then search.</p>
</main>

<script>
  // User-verified list of manhwa/manga hosting domains
  const MANHWA_SOURCES = [
    "kissmanga.in", "ksgroupscans.com", "kunmanga.co.uk", "kuramanga.com", "linkmanga.com",
    "mangaball.net", "manga.uno", "mangabats.com", "mangadex.org", "mangadot.net", "mangafire.to",
    "culturedworks.com", "reader.decadencescans.com", "galaxymanga.io", "globalcomix.com",
    "infinityscans.net", "isekaiscans.org", "kagane.to", "kingofshojo.com", "mangafox.fun",
    "mangafreak.me", "mangagg.com", "mangahub.io", "mangak.io", "mangakakalot.gg",
    "mangakakalot.fun", "1manga.co", "anisascans.in", "arenascan.com", "artlapsa.com",
    "bbato.com", "bookwalker.jp", "asurascans.com", "comicfury.com", "comix.to", "flamecomics.xyz"
  ];

  const qInput = document.getElementById('q');
  const keyInput = document.getElementById('apiKey');
  const includeInput = document.getElementById('includeDomains');
  const aniListAutoToggle = document.getElementById('aniListAutoToggle');
  const manhwaToggle = document.getElementById('manhwaToggle');
  const goBtn = document.getElementById('go');
  const results = document.getElementById('results');

  // Persist the key and custom domain list in this browser only.
  keyInput.value = localStorage.getItem('tavily_key') || '';
  keyInput.addEventListener('change', () => localStorage.setItem('tavily_key', keyInput.value.trim()));
  includeInput.value = localStorage.getItem('tavily_include_domains') || '';
  includeInput.addEventListener('change', () => localStorage.setItem('tavily_include_domains', includeInput.value.trim()));
  aniListAutoToggle.checked = localStorage.getItem('anilist_auto') !== 'false';  // on by default
  aniListAutoToggle.addEventListener('change', () => localStorage.setItem('anilist_auto', aniListAutoToggle.checked));

  // Fetches AniList's known alternate titles for a search term, silently.
  // Costs zero Tavily credits — AniList's API is free and separate.
  // Returns just the title, alone, if lookup fails or nothing matches — the
  // search still runs normally, it just won't benefit from alias expansion.
  async function fetchAniListAliases(title) {
    try {
      const query = `
        query ($search: String) {
          Media(search: $search, type: MANGA) {
            title { romaji english native }
            synonyms
          }
        }`;
      const resp = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query, variables: { search: title } })
      });
      if (!resp.ok) return [title];
      const data = await resp.json();
      const media = data.data && data.data.Media;
      if (!media) return [title];

      // Keep this tight — only the clean English and romaji titles. Native
      // Japanese script and the full synonyms list get skipped: jamming every
      // known alias into one OR query overloads the search and drags in
      // generic catalog/search-listing pages instead of the actual title.
      const names = new Set();
      if (media.title.english) names.add(media.title.english.trim());
      if (media.title.romaji) names.add(media.title.romaji.trim());
      if (!names.size) names.add(title);
      return [...names];
    } catch {
      return [title];  // network hiccup — fall back to searching just the typed title
    }
  }
  manhwaToggle.checked = localStorage.getItem('manhwa_toggle') === 'true';
  manhwaToggle.addEventListener('change', () => {
    localStorage.setItem('manhwa_toggle', manhwaToggle.checked);
    syncIncludeFieldState();
  });

  function syncIncludeFieldState() {
    includeInput.disabled = manhwaToggle.checked;
    includeInput.placeholder = manhwaToggle.checked
      ? 'Disabled — using Manhwa Sources list'
      : 'e.g. comix.to, mangapark.io';
  }
  syncIncludeFieldState();

  qInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  goBtn.addEventListener('click', () => runSearch());

  const clearCacheBtn = document.getElementById('clearCacheBtn');
  clearCacheBtn.addEventListener('click', () => {
    const keys = Object.keys(localStorage).filter(k =>
      k.startsWith('tavily_cache:') || k.startsWith('tavily_extract_cache:')
    );
    keys.forEach(k => localStorage.removeItem(k));
    results.innerHTML = `<p class="status">Cleared ${keys.length} cached item${keys.length === 1 ? '' : 's'} (searches + chapter checks).</p>`;
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function safeHref(url) {
    // Only allow http/https — blocks javascript:, data:, vbscript:, etc.
    // from being clickable, even if a source ever returned one.
    try {
      const parsed = new URL(url);
      return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? url : '#';
    } catch { return '#'; }
  }

  function cleanDomain(url) {
    try {
      const host = new URL(url).hostname.toLowerCase();
      return host.startsWith('www.') ? host.slice(4) : host;
    } catch { return null; }
  }

  function guessSiteName(title, domain) {
    if (!title) return domain || '?';
    // Site names usually trail the title after a separator: "Chapter 92 - Comix" → "Comix"
    const parts = title.split(/\s[-|–—]\s/);
    if (parts.length > 1) {
      const candidate = parts[parts.length - 1].trim();
      if (candidate.length > 1 && candidate.length < 40) return candidate;
    }
    return domain || title;
  }

  async function runSearch(forceQuery) {
    const query = (forceQuery || qInput.value).trim();
    const apiKey = keyInput.value.trim();
    if (!apiKey) { results.innerHTML = '<p class="status error">Add your Tavily API key first.</p>'; return; }
    if (!query) return;

    goBtn.disabled = true;

    let group = [query];
    if (aniListAutoToggle.checked) {
      results.innerHTML = '<p class="status">Checking AniList for alternate titles…</p>';
      group = await fetchAniListAliases(query);
    }

    // Combine alias group into ONE query using OR, instead of one Tavily call per alias.
    // Note: Tavily is a neural/semantic search engine, not a classic keyword engine —
    // "OR" isn't a documented, guaranteed operator here. It tends to work well in practice
    // (semantic search naturally treats it as "match either phrase"), but if you notice an
    // alias group's results only reflect one of the names, the fallback is splitting it back
    // into separate searches per name.
    const combinedQuery = group.length > 1
      ? group.map(n => `"${n}"`).join(' OR ')
      : query;

    try {
      const includeDomains = manhwaToggle.checked
        ? MANHWA_SOURCES
        : (includeInput.value.trim()
            ? includeInput.value.split(',').map(d => d.trim()).filter(Boolean)
            : undefined);

      // Cache key covers the actual query sent plus the domain filter in effect —
      // same search under a different filter is a genuinely different request.
      const cacheKey = 'tavily_cache:' + JSON.stringify({
        q: combinedQuery,
        d: includeDomains ? [...includeDomains].sort() : null
      });

      let data;
      let fromCache = false;
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        data = JSON.parse(cached);
        fromCache = true;
        results.innerHTML = '<p class="status">Loading cached result…</p>';
      } else {
        results.innerHTML = group.length > 1
          ? `<p class="status">Searching combined aliases…</p>`
          : '<p class="status">Searching…</p>';

        const body = {
          api_key: apiKey,
          query: combinedQuery,
          search_depth: 'basic',   // cheapest: 1 credit per call, even with a combined OR query
          max_results: 20,
          include_usage: true      // ask Tavily to report real credit cost for this call
        };
        if (includeDomains) body.include_domains = includeDomains;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);
        const resp = await fetch('https://api.tavily.com/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!resp.ok) throw new Error(`API error (${resp.status})`);
        data = await resp.json();

        // Cache the raw response so an identical future search costs 0 credits.
        try { localStorage.setItem(cacheKey, JSON.stringify(data)); }
        catch { /* localStorage full — not worth failing the search over */ }
      }

      let organic = data.results || [];

      // Tavily's include_domains matches at the domain level, which lets subdomains
      // through too (e.g. listing "mangadex.org" also allows "forum.mangadex.org").
      // Tighten to an exact hostname match against whatever filter is active, so a
      // forum/blog/wiki subdomain doesn't sneak in as if it were a hosting source.
      if (includeDomains) {
        const allowed = new Set(includeDomains.map(d => d.toLowerCase()));
        organic = organic.filter(r => {
          const d = cleanDomain(r.url);
          return d && allowed.has(d);
        });
      }

      if (!organic.length) {
        results.innerHTML = '<p class="status">No results found.</p>';
        return;
      }

      const names = new Map();  // siteName -> domain (for chip fallback display)
      const rows = [];
      for (const r of organic) {
        const domain = cleanDomain(r.url);
        const siteName = guessSiteName(r.title, domain);
        if (names.has(siteName)) continue;
        names.set(siteName, domain);
        const safeName = escapeHtml(siteName);
        const rawUrl = r.url || '';
        const safeUrl = escapeHtml(safeHref(rawUrl));
        const displayUrl = escapeHtml(rawUrl);
        rows.push(`<div class="result">
          <div class="domain">${safeName}</div>
          <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${displayUrl}</a>
          <div class="chapter-row">
            <button type="button" class="chapter-check-btn" data-url="${escapeHtml(rawUrl)}">Check chapter count</button>
            <span class="chapter-result"></span>
          </div>
        </div>`);
      }

      const chips = [...names.entries()].sort((a,b) => a[0].localeCompare(b[0]))
        .map(([name, domain]) => `<span class="chip">${escapeHtml(name)}${domain ? ` <span class="chip-domain">(${escapeHtml(domain)})</span>` : ''}</span>`).join('');

      // Real credit cost from Tavily, when available. Per Tavily's own docs, this
      // can show 0 early in an account's life even when a credit was genuinely
      // spent — it's not a bug in this tool if that happens occasionally.
      const creditCost = data.usage && typeof data.usage.credits === 'number'
        ? `${data.usage.credits} credit${data.usage.credits === 1 ? '' : 's'} used`
        : null;

      const costLabel = fromCache
        ? 'from cache — 0 credits used'
        : (creditCost || 'credit usage not reported');

      const aliasNote = group.length > 1
        ? `<p class="summary">Searched as: ${group.map(escapeHtml).join(' OR ')} — ${costLabel} — ${names.size} unique sites</p>`
        : `<p class="summary">${organic.length} results — ${costLabel} — ${names.size} unique sites</p>`;

      results.innerHTML = `
        ${aliasNote}
        ${rows.join('')}
        <div class="chips">${chips}</div>
      `;

      // Wire up each "Check chapter count" button now that the cards exist in the DOM.
      results.querySelectorAll('.chapter-check-btn').forEach(btn => {
        btn.addEventListener('click', () => checkChapterCount(btn.dataset.url, btn));
      });
    } catch (e) {
      const msg = e.name === 'AbortError' ? 'Request timed out — try again.' : e.message;
      results.innerHTML = `<p class="status error">${escapeHtml(msg)}</p>`;
    } finally {
      goBtn.disabled = false;
    }
  }

  async function checkChapterCount(url, btn, forceRefresh) {
    const apiKey = keyInput.value.trim();
    if (!apiKey) return;
    const label = btn.nextElementSibling;

    btn.disabled = true;
    btn.textContent = 'Checking…';

    try {
      const cacheKey = 'tavily_extract_cache:' + url;
      let content;
      let fromCache = false;
      let creditNote = '';
      const cached = !forceRefresh && localStorage.getItem(cacheKey);
      if (cached) {
        content = cached;
        fromCache = true;
      } else {
        const resp = await fetch('https://api.tavily.com/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: apiKey, urls: [url], extract_depth: 'basic', include_usage: true })
        });
        if (!resp.ok) throw new Error(`Extract error (${resp.status})`);
        const data = await resp.json();
        const result = (data.results || [])[0];
        if (!result || !result.raw_content) throw new Error('No content extracted');
        content = result.raw_content;
        creditNote = data.usage && typeof data.usage.credits === 'number'
          ? ` — ${data.usage.credits} credit${data.usage.credits === 1 ? '' : 's'}`
          : '';
        try { localStorage.setItem(cacheKey, content); } catch { /* storage full, skip caching */ }
      }

      // Best-effort pattern match — looks for "Chapter 123", "Ch. 45", "Ch 45.5", etc.
      // and takes the highest number found. Accuracy depends entirely on how that
      // specific site formats its chapter list in plain text.
      const matches = [...content.matchAll(/\bch(?:apter)?\.?\s*(\d+(?:\.\d+)?)\b/gi)];
      const resultText = !matches.length
        ? 'No chapter numbers detected'
        : `Highest found: Ch. ${Math.max(...matches.map(m => parseFloat(m[1])))}`;
      const sourceTag = fromCache ? ' (cached — tap Recheck for latest)' : creditNote;

      label.innerHTML = `${escapeHtml(resultText)}${escapeHtml(sourceTag)} <button type="button" class="recheck-btn">Recheck</button>`;
      label.style.color = matches.length ? 'var(--lavender)' : 'var(--paper-dim)';
      label.querySelector('.recheck-btn').addEventListener('click', () => checkChapterCount(url, btn, true));
    } catch (e) {
      label.textContent = `Couldn't check: ${e.message}`;
      label.style.color = 'var(--red)';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Check chapter count';
    }
  }
</script>

</body>
</html>
